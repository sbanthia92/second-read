name: Publish to PyPI and the MCP Registry

# Runs when a GitHub release is published (or by hand). Uses PyPI trusted
# publishing and GitHub OIDC for the MCP Registry: no token is stored anywhere.
# PyPI must list this repository, this workflow file and the "pypi"
# environment as a trusted publisher. The registry checks that the PyPI README
# contains "mcp-name: io.github.sbanthia92/second-read".
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install
      - name: Test
        run: |
          uv sync --locked --managed-python
          uv run pytest
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.5
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the release to appear on PyPI
        run: |
          set -euo pipefail
          version="$(jq -r .version server.json)"
          for attempt in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/second-read/${version}/json" > /dev/null; then
              echo "second-read ${version} is on PyPI"; exit 0
            fi
            sleep 20
          done
          echo "second-read ${version} did not appear on PyPI" >&2; exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Validate server.json
        run: ./mcp-publisher validate
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish

